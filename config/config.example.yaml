# Domain configuration placeholder.
#
# Sprint 1 does not implement the Matching Engine, Job Intelligence, or
# Recruiter Intelligence services, so these sections are documented here
# as the intended shape of future configuration -- per the Engineering
# Constitution's "Configuration" principle, none of this may be hardcoded
# when those services are built.

candidate:
  name: "Abiodun Adeniran"
  default_location: "West Bromwich, UK"
  commute:
    default_radius_miles: 25
    auto_widen_when_value_justifies: true

employment_preferences:
  contract_types: ["permanent", "inside_ir35", "outside_ir35"]
  work_mode: ["remote", "hybrid", "office_if_justified"]
  salary:
    # Updated per the Job Discovery MVP directive (14 August 2026) --
    # the real, current default range. Now actually consumed by
    # DiscoverySettings (app/core/config.py) as the fallback when no
    # per-request override and no SalaryPreference row exist -- this
    # is the first real consumer of this file's documented shape, not
    # just documentation of an intended future one.
    permanent_gbp: { min: 40000, max: 110000, allow_above_max: true }
    contract_gbp_per_day: { min: 350, max: 700, allow_above_max: true }

matching_weights:
  # Placeholder only -- implemented with the Matching Engine service.
  skill_match: 0.20
  experience_match: 0.15
  salary: 0.10
  contract_type: 0.05
  remote_preference: 0.10
  commute: 0.10
  career_progression: 0.10
  learning_opportunity: 0.10
  company_preference: 0.05
  recruiter_relationship: 0.05

